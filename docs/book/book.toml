[book]
title = "Semulith"
description = "Trustworthy CPU and DSP software models in Rust, and the evidence discipline that makes their claims mean something."
authors = ["Semulith maintainers"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
git-repository-url = ""
no-section-label = false

[preprocessor.project-record-links]
command = "python3 ../../scripts/book_navigation.py"
renderers = ["html"]
after = ["links"]
