[book]
title = "Semulith"
description = "Trustworthy CPU and DSP software models in Rust, and the evidence discipline that makes their claims mean something."
authors = ["Semulith maintainers"]
language = "en"
src = "src"

[output.html]
# The book's path under the shared `docs` root the book says to serve, so its 404 page finds its own assets (D80).
site-url = "/book/book/"
default-theme = "rust"
git-repository-url = ""
no-section-label = false
additional-js = ["theme/active-chapter.js"]

[preprocessor.project-record-links]
command = "python3 ../../scripts/book_navigation.py"
renderers = ["html"]
after = ["links"]

[preprocessor.source-check]
command = "python3 ../../scripts/book_includes.py"
renderers = ["html"]
before = ["links"]
optional = false
