[book]
title = "rv64i-lab-v0 — the model book"
description = "How the rv64i-lab-v0 processor model went from pinned documents to a running laboratory: the complete materials bill, and the method."
authors = ["Semulith maintainers"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
git-repository-url = ""
no-section-label = false

[preprocessor.project-record-links]
command = "python3 ../../../scripts/book_navigation.py"
renderers = ["html"]
after = ["links"]

[preprocessor.source-check]
command = "python3 ../../../scripts/book_includes.py"
renderers = ["html"]
before = ["links"]
optional = false
