[book]
title = "rv64gc-lab-v0 — the model book"
description = "The selected RV64GC processor: pinned materials, declared laboratory choices, evidence and remaining acceptance."
authors = ["Semulith maintainers"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
git-repository-url = ""
no-section-label = false

[preprocessor.project-record-links]
command = "python3 ../../../scripts/book_navigation.py"
renderers = ["html"]
after = ["links"]

[preprocessor.source-check]
command = "python3 ../../../scripts/book_includes.py"
renderers = ["html"]
before = ["links"]
optional = false
