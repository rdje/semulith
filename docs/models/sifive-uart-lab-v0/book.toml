[book]
title = "sifive-uart-lab-v0 — the model book"
description = "The SiFive UART device unit of netboard-lab-v0: the complete materials bill for its dossier, and the method from datasheet to device contract."
authors = ["Semulith maintainers"]
language = "en"
src = "src"

[output.html]
# The book's path under the shared `docs` root the book says to serve, so its 404 page finds its own assets (D80).
site-url = "/models/sifive-uart-lab-v0/book/"
default-theme = "rust"
git-repository-url = ""
no-section-label = false

[preprocessor.project-record-links]
command = "python3 ../../../scripts/book_navigation.py"
renderers = ["html"]
after = ["links"]

[preprocessor.source-check]
command = "python3 ../../../scripts/book_includes.py"
renderers = ["html"]
before = ["links"]
optional = false
