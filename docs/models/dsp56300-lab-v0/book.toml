[book]
title = "dsp56300-lab-v0 — the model book"
description = "How the dsp56300-lab-v0 bounded DSP subset went from the pinned family manual to a differentially agreed sibling-crate model: the complete materials bill, and the method."
authors = ["Semulith maintainers"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
git-repository-url = ""
no-section-label = false

[preprocessor.project-record-links]
command = "python3 ../../../scripts/book_navigation.py"
renderers = ["html"]
after = ["links"]

[preprocessor.source-check]
command = "python3 ../../../scripts/book_includes.py"
renderers = ["html"]
before = ["links"]
optional = false
