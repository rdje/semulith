name: doctrines
# E4 enforcement: the SAME doctrine enforcer the pre-commit hook runs, so a locally
# --no-verify'd commit still fails here.
on:
  push:
  pull_request:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make spine scripts executable
        run: chmod +x scripts/*.sh knowledge-map/scripts/*.sh .githooks/pre-commit .githooks/commit-msg || true
      - name: Keep dependency and temporary stores on the repository volume
        run: |
          mkdir -p .app-data/cargo-home .app-data/rustup target/ci-tmp
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.app-data/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.app-data/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
          echo "TMPDIR=$GITHUB_WORKSPACE/target/ci-tmp" >> "$GITHUB_ENV"
      - name: Provision stable Rust and the browser target in the local tool store
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown --no-self-update
      - name: Install the pinned book tool (UNIT-BOOKS builds every registered book)
        run: |
          bash scripts/install_ci_mdbook.sh
          echo "$GITHUB_WORKSPACE/.app-data/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Vendor the dependency store (on-volume — .cargo/config.toml routes cargo there)
        run: make vendor
      - name: Run the doctrine enforcer
        run: scripts/check_doctrines.sh
      - name: Preserve the guest self-test diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-self-test-log
          path: target/guest-gen/self-test.log
          if-no-files-found: ignore
