name: portability
# G-PORTABILITY's CI home (P2-SCALAR.9, decision_release-route-x86-64-leg): the mandatory
# two-native-host leg runs as a matrix — ubuntu-latest is x86-64, macos-latest is aarch64 —
# and the agree job byte-compares the two hosts' digest manifests. The Miri and
# cross-endian legs run on x86-64 with the pinned nightly provisioning.
on:
  push:
  pull_request:

jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep tool, dependency and temporary stores local
        run: |
          mkdir -p .app-data/cargo-home .app-data/rustup target/ci-tmp
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.app-data/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.app-data/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
          echo "TMPDIR=$GITHUB_WORKSPACE/target/ci-tmp" >> "$GITHUB_ENV"
      - name: Provision stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Vendor the dependency store (on-volume — .cargo/config.toml routes cargo there)
        run: make vendor
      - name: The native leg + the digest manifest
        run: bash scripts/check_portability.sh --leg native --emit-manifest manifest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-log-${{ matrix.os }}
          path: target/portability/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.os }}
          path: manifest.txt

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep tool, dependency and temporary stores local
        run: |
          mkdir -p .app-data/cargo-home .app-data/rustup target/ci-tmp
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.app-data/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.app-data/rustup" >> "$GITHUB_ENV"
          echo "TMPDIR=$GITHUB_WORKSPACE/target/ci-tmp" >> "$GITHUB_ENV"
      - name: Verify the cold single-leg controls before provisioning Miri
        run: bash scripts/check_portability.sh --self-test
      - name: The pinned nightly + Miri + the big-endian target
        run: |
          toolchain="$(bash scripts/check_portability.sh --print-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --component miri,rust-src --target powerpc64-unknown-linux-gnu --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Vendor the dependency store (on-volume — .cargo/config.toml routes cargo there)
        run: make vendor
      - name: The Miri leg
        run: bash scripts/check_portability.sh --leg miri
      - name: The cross-endian leg
        run: bash scripts/check_portability.sh --leg cross-endian
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miri-logs
          path: target/portability/*.log
          if-no-files-found: ignore

  agree:
    needs: [host]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch both manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
      - name: Byte-compare the two hosts' manifests
        run: |
          set -e
          ls
          diff manifest-ubuntu-latest/manifest.txt manifest-macos-latest/manifest.txt && \
            echo "portability matrix: the two hosts agree byte-identically"
