# profiles/rv64i-lab-v0/references.toml — the reference candidate dossier for `rv64i-lab-v0`.
#
# ⛔ EVERY FIELD HERE IS AN OBSERVED FACT. Rule `SRC-03` forbids recording availability that has
# not been established, and this file is where that rule bites hardest: a candidate list is the
# easiest document in a project to fill in from reputation. Each `obtained` row below was run on
# this host; each `not_obtained` row records the attempt and what stopped it.
#
# ⚠️ WHAT THIS FILE DOES NOT CLAIM. Nothing here says a reference is USABLE. `P0-PROFILE.6` is
# the leaf that runs a matched-profile experiment and reproduces it, and `docs/EVIDENCE_AND_GATES.md`
# §5 makes that the gate: a reference is not usable until a real experiment has passed against it.
# These rows say "we have it, we can configure it, and this is exactly which it is".
#
# ⚠️ AND NOTHING HERE IS AN INDEPENDENCE CLAIM. Three obtained models is not three opinions —
# `EVD-04` requires shared semantic ancestry to be examined rather than inferred from the fact
# that the binaries differ. `P0-PROFILE.7` owns that, and the `lineage` field below is its input,
# not its answer.
#
# Re-derive with `scripts/fetch_references.sh [--verify-only]`. It needs the network and a
# compiler, so it is deliberately NOT a commit gate — the same reasoning as `fetch_sources.sh`.

profile = "rv64i-lab-v0"
retrieved = "2026-09-14"
work_dir = "target/refs"

# The host matters and is therefore recorded: two of the three candidates below were obtained in
# a form that is specific to it (a prebuilt Mac-arm64 binary; a source build against the system
# toolchain). On another host the same commands can produce a different answer, and `SRC-03`
# makes that a fact to re-establish rather than inherit.
[host]
os = "macOS 26.6.2 (build 25G83)"
kernel = "Darwin 25.6.0"
arch = "arm64"
cxx = "Apple clang (/usr/bin/clang)"
note = "The repository volume is /dev/disk7s1; the shared toolchain prefix /opt/homebrew is on /dev/disk3s1s1. They are DIFFERENT volumes, which is why every artifact this project owns is built or unpacked under `target/refs/` and nothing is installed into the shared prefix (policy: project data locality)."

# ───────────────────────────────────────────────────────────── candidate 1: Sail RISC-V
[[candidate]]
id = "sail-riscv"
role = "primary oracle candidate"
status = "obtained"
kind = "prebuilt release binary"
origin = "https://github.com/riscv/sail-riscv"
release = "0.14"
released = "2026-09-05"
asset = "sail-riscv-Mac-arm64.tar.gz"
asset_sha256 = "340ab7080871b191b0e719b5ed5be34f4725704dfe52a5aeb50ea36be277464e"
asset_bytes = 2038243
http_status = 200
binary = "target/refs/sail-riscv-Mac-arm64/bin/sail_riscv_sim"
binary_sha256 = "16de42a86e4ea7a300385092632cd95d153cb3f6c119d31eaa9384953990b7bf"
build_info = "Sail RISC-V release 0.14; git 29e6158; Sail 0.20.2 (opam-v2.5.1); AppleClang 21.0.0.21000101; CLI11 2.6.2; ELFIO 3.12; JSONCONS 1.8.1; ASIO 103600"
invocation = "sail_riscv_sim --config-override <override.json> [--trace...] <elf>"
trace_granularity = "per instruction, and per effect within it: --trace-instr, --trace-gpr, --trace-csr, --trace-mem, --trace-exception, --trace-interrupt, --trace-pma, --trace-pmp, --trace-step; --trace enables all but TLB/PTW/gdbserver. Output to --trace-output <file>."
injection = "--gdb-server-port <n> (GDB remote: register and memory write, single step) and --rvfi-dii <port> (RVFI Direct Instruction Injection). --inst-limit bounds a run."
matched_config = "reference/sail-rv64i-lab-v0.override.json"
matched_isa_string = "rv64i_zvl32b"
terms = "BSD-2-Clause (the sail-riscv model). Read and executed locally; no copy is committed and nothing is redistributed."
lineage = "The Sail RISC-V model is the RISC-V International reference formal model, written in the Sail ISA description language. Any tool that DERIVES expected results from it — notably ACT's reference signatures — shares an ancestor with it. Input to P0-PROFILE.7; not resolved here."

