# profiles/rv64i-lab-v0/profile.toml — the development profile for Semulith's first experiment.
#
# STATUS: development profile, not an accepted one. Nothing here has evidence attached.
# `SCP-01` requires every support claim to identify a versioned profile, an environment
# contract, an observation contract and the applicable specification revisions; this file is
# the first of those four, and the other three do not exist yet.
#
# Every decision below carries an `authority`, and that field is the point of the file:
#   architecture           the specification states it; we have no choice
#   execution-environment  the specification explicitly delegates it to the EEI; we chose
#   laboratory             neither — a policy this harness adopts over a case the architecture
#                          leaves UNSPECIFIED, or a boundary the harness itself imposes
# ⛔ A `laboratory` decision can never override an `architecture` one. Where a laboratory
# policy resolves an UNSPECIFIED case, the model must still be able to report that the case WAS
# unspecified, because a differential comparison against another implementation that chose
# differently is not a defect in either (`SEM-07`).

[profile]
id = "rv64i-lab-v0"
version = "0"
status = "development"
architecture = "RISC-V"
base = "RV64I"
chapter_version = "2.1"
spec_revision = "v20260120"
harts = 1
xlen = 64
ilen = 32
ialign = 32
extensions = []                      # none. No C, M, A, F, D, Zicsr, Zifencei.
privilege_modes = []                 # none modelled: unprivileged base ISA only
sources = ["RVI-INTRO", "RVI-RV32I", "RVI-RV64I"]

# ─────────────────────────────────────────────────────────────── architectural state
[state]
integer_registers = 32               # x0..x31
x0_hardwired_zero = true
register_width_bits = 64
program_counter = "pc"
csrs = []                            # Zicsr is not in this profile
authority = "architecture"
source = "RVI-RV32I §1.1.1 Programmers' Model; RVI-RV64I §3.1.1 Register State"

# ─────────────────────────────────────────────────────────────── instruction scope
# Enumerated, not counted from memory: 40 base + 12 RV64I additions = 52.
[scope]
count_base = 40
count_rv64i_additions = 12
count_total = 52
authority = "architecture"
source = "RVI-RV32I §1.1.4–§1.1.8; RVI-RV64I §3.1.2–§3.1.3"

base_u_type      = ["LUI", "AUIPC"]
base_jumps       = ["JAL", "JALR"]
base_branches    = ["BEQ", "BNE", "BLT", "BGE", "BLTU", "BGEU"]
base_loads       = ["LB", "LH", "LW", "LBU", "LHU"]
base_stores      = ["SB", "SH", "SW"]
base_op_imm      = ["ADDI", "SLTI", "SLTIU", "XORI", "ORI", "ANDI", "SLLI", "SRLI", "SRAI"]
base_op          = ["ADD", "SUB", "SLL", "SLT", "SLTU", "XOR", "SRL", "SRA", "OR", "AND"]
base_misc_mem    = ["FENCE"]
base_system      = ["ECALL", "EBREAK"]
rv64_loads       = ["LWU", "LD"]
rv64_stores      = ["SD"]
rv64_op_imm_32   = ["ADDIW", "SLLIW", "SRLIW", "SRAIW"]
rv64_op_32       = ["ADDW", "SUBW", "SLLW", "SRLW", "SRAW"]

# ─────────────────────────────────────────────────────────────── resolved decisions
# id | authority | the decision | where it comes from

[[decision]]
id = "D-XLEN"
authority = "architecture"
statement = "XLEN = 64. The integer registers and the supported user address space are 64 bits."
source = "RVI-RV64I §3.1.1"

[[decision]]
id = "D-WSUFFIX"
authority = "architecture"
statement = "The *W instructions ignore the upper 32 bits of their inputs, produce a 32-bit signed result, and sign-extend it to 64 bits — bits XLEN-1 through 31 are equal. Overflow is ignored."
source = "RVI-RV64I §3.1.2, §3.1.2.1, §3.1.2.2"

[[decision]]
id = "D-SHAMT"
authority = "architecture"
statement = "SLLI/SRLI/SRAI take a 6-bit shift amount from the I-immediate; SLL/SRL/SRA use only the low 6 bits of rs2. SLLIW/SRLIW/SRAIW take 5 bits, and SLLW/SRLW/SRAW use rs2[4:0]."
source = "RVI-RV64I §3.1.2.1, §3.1.2.2"

[[decision]]
id = "D-SHIFTW-RESERVED"
authority = "architecture"
statement = "SLLIW, SRLIW and SRAIW encodings with imm[5] != 0 are RESERVED. They were previously defined to raise an illegal-instruction exception; this revision marks them reserved instead, and calls the change backwards-compatible."
source = "RVI-RV64I §3.1.2.1"
note = "A high-value differential case: a reference model built against the older text may trap where this one need not. See OQ-2."

[[decision]]
id = "D-LUI-AUIPC"
authority = "architecture"
statement = "LUI places the 32-bit U-immediate in rd with the low 12 bits zeroed, sign-extended to 64 bits. AUIPC forms the same 32-bit offset, sign-extends it to 64 bits, and adds it to the address of the AUIPC instruction."
source = "RVI-RV64I §3.1.2.1"

[[decision]]
id = "D-LOAD-EXT"
authority = "architecture"
statement = "LW sign-extends its 32-bit result to 64 bits; LWU zero-extends it. LH/LB sign-extend and LHU/LBU zero-extend analogously. SD/SW/SH/SB store the low 64/32/16/8 bits of rs2."
source = "RVI-RV64I §3.1.3"

[[decision]]
id = "D-LOAD-X0"
authority = "architecture"
statement = "A load with rd = x0 must still raise any exceptions and cause any other side effects, even though the loaded value is discarded."
source = "RVI-RV32I §1.1.6"

[[decision]]
id = "D-JALR-LSB"
authority = "architecture"
statement = "JALR computes its target by adding the sign-extended 12-bit immediate to rs1 and then setting the least-significant bit of the result to zero."
source = "RVI-RV32I §1.1.5.1"

[[decision]]
id = "D-NO-DELAY-SLOTS"
authority = "architecture"
statement = "Control transfers have no architecturally visible delay slots."
source = "RVI-RV32I §1.1.5"

[[decision]]
id = "D-IALIGN"
authority = "execution-environment"
statement = "IALIGN = 32, because no 16-bit-length extension is included. An instruction-address-misaligned exception is therefore raised on a taken branch or unconditional jump whose target is not 4-byte aligned."
source = "RVI-RV32I §1.1.5, §1.1.5.1, §1.1.5.2"

[[decision]]
id = "D-MISALIGN-REPORT"
authority = "architecture"
statement = "The instruction-address-misaligned exception is reported on the branch or jump, NOT on the target instruction. A branch that is not taken raises no such exception."
source = "RVI-RV32I §1.1.5.2"

[[decision]]
id = "D-FETCH-FAULT-REPORT"
authority = "architecture"
statement = "An instruction access-fault on the TARGET of a jump or taken branch is reported on the target instruction, not on the jump or branch — the opposite reporting point from misalignment."
source = "RVI-RV32I §1.1.5"
note = "These two rules point in opposite directions on purpose. Getting one of them wrong produces a model that is right about the fault and wrong about where it happened."

[[decision]]
id = "D-ENDIAN"
authority = "execution-environment"
statement = "Little-endian. The specification delegates this to the EEI; endianness in RISC-V is byte-address invariant."
source = "RVI-RV32I §1.1.6"

[[decision]]
id = "D-MISALIGN-DATA"
authority = "execution-environment"
statement = "Misaligned loads and stores are NOT handled invisibly. A misaligned access raises an address-misaligned exception, delivered as a CONTAINED trap reported to the harness. Access-fault is not substituted, because this profile declares no memory region with side effects."
source = "RVI-RV32I §1.1.6"
note = "The specification requires an EEI that does not guarantee invisible handling to define whether the result is a contained or a fatal trap. This is that definition."

[[decision]]
id = "D-RESERVED-DECODE"
authority = "laboratory"
statement = "Decoding a reserved instruction raises an illegal-instruction exception. The architecture declares this behaviour UNSPECIFIED and notes that platforms differ, so the model must record the outcome as a laboratory policy over an UNSPECIFIED case and must be able to report it as such."
source = "RVI-RV32I §1.1.5.2 (reserved-instruction note); RVI-INTRO, UNSPECIFIED Behaviors and Values"

[[decision]]
id = "D-HINTS"
authority = "architecture"
statement = "Every code point in the RV64I HINT table executes as a no-op that writes nothing to x0's architectural value; a HINT must not trap. This profile implements no HINT behaviour beyond that."
source = "RVI-RV64I §3.1.4 Table 1"

[[decision]]
id = "D-FENCE"
authority = "execution-environment"
statement = "FENCE is decoded and must not trap. With one hart, no external devices and an in-order model, it has no observable effect. FENCE.TSO (fm=1000, pred=RW, succ=RW) is accepted and treated as FENCE RW,RW, which the specification states is correct. Other fm values are reserved and fall under D-RESERVED-DECODE."
source = "RVI-RV32I §1.1.7, Table 3 Fence mode encoding"
note = "This profile makes NO memory-ordering claim. RVWMO is out of scope until MC-MULTICORE."

[[decision]]
id = "D-ECALL-EBREAK"
authority = "execution-environment"
statement = "ECALL and EBREAK cause a precise REQUESTED trap to the execution environment. With no privileged modes in this profile there is no guest handler, so both are reported to the harness as a typed environment-trap outcome and execution stops unless the harness contract says otherwise."
source = "RVI-RV32I §1.1.8; RVI-INTRO, Exceptions/Traps/Interrupts (Requested Trap)"
note = "This is why ModelError and TargetEvent must be different types: 'the guest asked the environment for something' is not 'the model cannot do this'."

[[decision]]
id = "D-ENTRY-STATE"
authority = "laboratory"
statement = "At reset: pc = the declared entry address of the loaded image; x1..x31 = 0; x0 is architecturally 0 always. The base ISA does not define the initial contents of x1..x31 — the EEI does — so this is a harness declaration and guest programs may not assume any other environment provides it."
source = "RVI-INTRO, RISC-V Software Execution Environments and Harts"

[[decision]]
id = "D-ADDRESS-SPACE"
authority = "execution-environment"
statement = "A 64-bit byte-addressed space in which only the regions declared by the harness memory map are legal. An access outside a declared region raises an access-fault exception. The specification delegates which portions are legal to the execution environment."
source = "RVI-RV64I §3.1.3; RVI-RV32I §1.1.6"
