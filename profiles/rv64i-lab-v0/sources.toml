# ⛔ WHAT A HASH HERE DOES AND DOES NOT PIN. `sha256` is the digest of the rendered HTML page
# as served at `retrieved`. The **normative identity** is `revision` plus the chapter's own
# stated version. A site template change alters the digest without altering the specification,
# and a specification erratum could in principle alter the text without altering the URL. So a
# digest mismatch is a signal to RE-READ and re-confirm the locators, not proof of a semantic
# change — and a digest match is not proof that the normative text is unchanged either, only
# that the artifact we read is the artifact you are reading.
