# smoke-arith.expected.toml — the expected observations for `smoke-arith.s`.
#
# ⛔ EVERY VALUE HERE WAS DERIVED FROM THE PINNED SPECIFICATION PROSE BEFORE THE PROGRAM WAS RUN.
# `EVD-05` and `docs/EVIDENCE_AND_GATES.md` require it: an expected value copied out of a model's
# output tests that the model is self-consistent and nothing else. The `derivation` field on each
# step is the reasoning, and `source` is where in the pinned artifacts the rule is stated.
#
# ⚠️ WHAT THE PINNED SPECIFICATION DOES AND DOES NOT SUPPLY. It supplies all of these SEMANTICS,
# in prose. It does NOT supply the instruction ENCODINGS — measured across all six pinned
# artifacts, `grep -cE '[01]{7}'` returns 0 for every one, because the format diagrams are
# images. Encodings therefore come from a separately pinned source (`riscv-opcodes`), which is
# recorded in `references.toml` and is a different provenance from the values below.

program = "smoke-arith.s"
entry = "0x80000000"
instructions = 12

[[step]]
n = 0
insn = "lui x1, 0x80000"
writes = { x1 = "0xFFFFFFFF80000000" }
derivation = "The U-immediate 0x80000 occupies bits 31..12, so the 32-bit value is 0x80000000. LUI places that 32-bit value in rd with the low 12 bits zeroed and SIGN-EXTENDS it to 64 bits; bit 31 is set, so the upper half becomes all ones."
source = "RVI-RV64I §3.1.2.1 (D-LUI-AUIPC)"

[[step]]
n = 1
insn = "addiw x2, x1, 1"
writes = { x2 = "0xFFFFFFFF80000001" }
derivation = "ADDIW ignores the upper 32 bits of rs1: it adds the sign-extended immediate to the low 32 bits (0x80000000 + 1 = 0x80000001), discards overflow, and sign-extends the 32-bit result. Bit 31 of the result is set."
source = "RVI-RV64I §3.1.2 'ADDIW is an RV64I instruction that adds the sign-extended 12-bit immediate…' (D-WSUFFIX)"

[[step]]
n = 2
insn = "addi x3, x0, -1"
writes = { x3 = "0xFFFFFFFFFFFFFFFF" }
derivation = "x0 is hardwired to zero, and the 12-bit immediate is sign-extended to XLEN before the add: 0 + (-1) = -1 = all ones at 64 bits."
source = "RVI-RV32I §1.1.1 (x0 hardwired); §1.1.4 (I-immediate sign-extension)"

[[step]]
n = 3
insn = "slli x4, x3, 63"
writes = { x4 = "0x8000000000000000" }
derivation = "At XLEN=64 the shift amount is 6 bits, so 63 is legal. Shifting all-ones left by 63 leaves only bit 63 set."
source = "RVI-RV64I §3.1.2.1 (D-SHAMT)"

[[step]]
n = 4
insn = "srli x5, x4, 63"
writes = { x5 = "0x0000000000000001" }
derivation = "Logical right shift brings in zeros, so bit 63 moves to bit 0 and every other bit is zero."
source = "RVI-RV64I §3.1.2.1"

[[step]]
n = 5
insn = "srai x6, x4, 63"
writes = { x6 = "0xFFFFFFFFFFFFFFFF" }
derivation = "Arithmetic right shift replicates the sign bit. The operand's bit 63 is 1, so all 64 bits become 1. Contrast with step 4: the same operand and amount, a different instruction, a different answer — which is why both are here."
source = "RVI-RV64I §3.1.2.1"

[[step]]
n = 6
insn = "addiw x7, x3, 0"
writes = { x7 = "0xFFFFFFFFFFFFFFFF" }
derivation = "ADDIW rd, rs1, 0 writes the sign extension of the low 32 bits of rs1 (the SEXT.W pseudoinstruction). The low 32 bits are 0xFFFFFFFF, whose sign extension is all ones."
source = "RVI-RV64I §3.1.2 'Note, ADDIW rd, rs1, 0 writes the sign extension of the lower 32 bits'"

[[step]]
n = 7
insn = "slliw x8, x3, 31"
writes = { x8 = "0xFFFFFFFF80000000" }
derivation = "The *W shifts use a 5-bit amount and operate on the low 32 bits: 0xFFFFFFFF << 31 = 0x80000000 as a 32-bit result, then sign-extended to 64 bits. The 6-bit/5-bit distinction against step 3 is the point of this pair."
source = "RVI-RV64I §3.1.2.1 (D-SHAMT)"

[[step]]
n = 8
insn = "add x9, x1, x2"
writes = { x9 = "0xFFFFFFFF00000001" }
derivation = "0xFFFFFFFF80000000 + 0xFFFFFFFF80000001 = 0x1FFFFFFFF00000001, which wraps modulo 2^64 to 0xFFFFFFFF00000001. Overflow is ignored."
source = "RVI-RV32I §1.1.4 (ADD ignores overflow); RVI-INTRO, Memory (arithmetic wraps modulo 2^XLEN — D-ADDR-WRAP)"

[[step]]
n = 9
insn = "addi x10, x0, 1"
writes = { x10 = "0x0000000000000001" }
derivation = "Building the main-memory base arithmetically. LUI cannot produce 0x0000_0000_8000_0000, because any U-immediate with bit 31 set is sign-extended to a negative 64-bit value — which is exactly what step 0 demonstrates."
source = "RVI-RV32I §1.1.4"

[[step]]
n = 10
insn = "slli x10, x10, 31"
writes = { x10 = "0x0000000080000000" }
derivation = "1 << 31 at 64 bits is 0x0000_0000_8000_0000: the base of the declared MainMemory region, positive because the shift is a 64-bit operation and no sign extension occurs."
source = "RVI-RV64I §3.1.2.1"

[[step]]
n = 11
insn = "sd x9, 1024, x10"
writes = { }
derivation = "A store writes memory and no register. Its offset is 1024 bytes past the base, well clear of the 48-byte program, so the store cannot modify code that has been or will be fetched (which D-CODE-VISIBILITY would otherwise make observable)."
source = "RVI-RV64I §3.1.3 (SD stores the low 64 bits of rs2)"
