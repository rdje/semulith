# Workspace root. Add crates under crates/*. Rename/replace the starter `app` crate with
# your project's crates (cargo-generate substitutes {{project-name}} if you use that path).
[workspace]
resolver = "2"
members = ["crates/*"]

# ⛔ VENDORED SUBMODULES ARE NOT WORKSPACE MEMBERS. `vendor/linkedspec` is a pinned git submodule
# carrying its own workspace, its own lockfile and its own edition (2024, where this workspace is
# 2021). Without this exclusion Cargo tries to absorb it and refuses to build either side:
#   "current package believes it's in a workspace when it's not"
# Excluding it keeps the vendored project buildable on ITS OWN terms, which is the whole point of
# consuming a published integration rather than forking one.
exclude = ["vendor"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Shared lints so every crate inherits the same strictness (opt in per crate with
# `[lints] workspace = true`). clippy runs at deny-warnings in `make check` / CI.
[workspace.lints.clippy]
all = "warn"
