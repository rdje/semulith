# semulith-cli — the laboratory's control surface: user commands and report
# presentation (docs/ARCHITECTURE.md §4). Calls the core and verification APIs; never
# duplicates behaviour they own. The proposed CLI name is `semulith` (ROADMAP.md §8).
[package]
name = "semulith-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The laboratory's control surface: user commands and report presentation"

[lints]
workspace = true

[[bin]]
name = "semulith"
path = "src/main.rs"

[dependencies]
semulith-core = { version = "0.1.0", path = "../semulith-core" }
semulith-verify = { version = "0.1.0", path = "../semulith-verify" }
